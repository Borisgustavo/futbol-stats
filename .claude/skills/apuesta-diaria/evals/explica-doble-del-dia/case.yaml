expected_outcome: |
  Presenta la Doble del 25-oct-2026 (Fortuna Sittard vs Excelsior, Más de 1,5 goles al 89%,
  y Nacional de Madeira vs Braga, Más de 1,5 goles al 78%) con su cuota total de 1,45 y aclara
  que las cuotas son justas del modelo, no de mercado. Explica la elección con los goles
